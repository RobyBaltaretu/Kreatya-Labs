# API de Kreatya Labs — Hono sobre Cloudflare Workers (plan gratuito)
name = "kreatya-api"
main = "src/index.ts"
compatibility_date = "2025-09-01"
compatibility_flags = ["nodejs_compat"]
workers_dev = true

# routes = [{ pattern = "api.kreatya.es", custom_domain = true }]

[vars]
ENVIRONMENT = "production"
ALLOWED_ORIGINS = "https://kreatya.es,https://admin.kreatya.es,http://localhost:4321,http://localhost:5173"
ACCESS_TEAM_DOMAIN = "kreatya.cloudflareaccess.com"
ACCESS_AUD = ""
LEAD_NOTIFY_EMAIL = "hola@kreatya.es"
DEMO_BASE_URL = "https://demo.kreatya.es"

# Secretos (wrangler secret put …): BUILD_TOKEN, TURNSTILE_SECRET, RESEND_API_KEY, DEPLOY_HOOK_URL, DEV_USER_EMAIL

[[d1_databases]]
binding = "DB"
database_name = "kreatya-db"
database_id = "00000000-0000-0000-0000-000000000000" # sustituir tras `wrangler d1 create kreatya-db`
migrations_dir = "../../packages/db/migrations"

[[r2_buckets]]
binding = "MEDIA"
bucket_name = "kreatya-media"

[[kv_namespaces]]
binding = "KV"
id = "00000000000000000000000000000000" # sustituir tras `wrangler kv namespace create KV`

[triggers]
crons = ["15 2 * * *"] # agregados nocturnos de KPIs y alertas de cuota

[env.preview]
name = "kreatya-api-preview"
vars = { ENVIRONMENT = "preview", ALLOWED_ORIGINS = "*", ACCESS_TEAM_DOMAIN = "kreatya.cloudflareaccess.com", ACCESS_AUD = "", LEAD_NOTIFY_EMAIL = "hola@kreatya.es", DEMO_BASE_URL = "https://demo.kreatya.es" }
[[env.preview.d1_databases]]
binding = "DB"
database_name = "kreatya-db-preview"
database_id = "00000000-0000-0000-0000-000000000001"
migrations_dir = "../../packages/db/migrations"
[[env.preview.r2_buckets]]
binding = "MEDIA"
bucket_name = "kreatya-media-preview"
[[env.preview.kv_namespaces]]
binding = "KV"
id = "00000000000000000000000000000001"
