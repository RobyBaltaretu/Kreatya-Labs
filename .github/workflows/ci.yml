name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Lint, tipos y tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - name: Esquema D1 sincronizado con las migraciones
        run: pnpm --filter @kreatya/db exec drizzle-kit check

  e2e:
    name: E2E (Playwright) + Lighthouse
    runs-on: ubuntu-latest
    needs: check
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @kreatya/web build
      - run: pnpm --filter @kreatya/admin build
        env: { VITE_HASH_ROUTER: '1' }
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with: { name: playwright-report, path: playwright-report }
      - name: Lighthouse ≥ 95 en las cuatro categorías
        run: npx --yes @lhci/cli@0.15.1 autorun
      - name: Enlaces rotos
        run: npx --yes linkinator@6.1.2 ./apps/web/dist --recurse --skip "^https?://(?!localhost)"
