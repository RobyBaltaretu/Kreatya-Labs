name: Deploy

# main → producción; cualquier otra rama → preview de Cloudflare Pages.
on:
  push:
  workflow_dispatch:
  repository_dispatch:
    types: [publish] # disparado por el panel («Publicar web») vía deploy hook

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

env:
  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
  CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

jobs:
  deploy:
    runs-on: ubuntu-latest
    if: ${{ vars.CLOUDFLARE_ENABLED == 'true' }}
    environment: ${{ github.ref == 'refs/heads/main' && 'production' || 'preview' }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile

      - name: API · migraciones D1 y despliegue del Worker
        working-directory: apps/api
        run: |
          ENV_FLAG=${{ github.ref == 'refs/heads/main' && '' || '--env preview' }}
          DB=${{ github.ref == 'refs/heads/main' && 'kreatya-db' || 'kreatya-db-preview' }}
          npx wrangler d1 migrations apply $DB --remote $ENV_FLAG
          npx wrangler deploy $ENV_FLAG

      - name: Web · build estático desde la API
        run: pnpm --filter @kreatya/web build
        env:
          CONTENT_API_URL: ${{ vars.CONTENT_API_URL }}
          CONTENT_API_TOKEN: ${{ secrets.BUILD_TOKEN }}
          PUBLIC_API_URL: ${{ vars.PUBLIC_API_URL }}
          PUBLIC_TURNSTILE_SITE_KEY: ${{ vars.TURNSTILE_SITE_KEY }}

      - name: Panel · build
        run: pnpm --filter @kreatya/admin build
        env:
          VITE_API_URL: ${{ vars.PUBLIC_API_URL }}

      - name: Publicar en Cloudflare Pages
        run: |
          BRANCH=${{ github.head_ref || github.ref_name }}
          npx wrangler pages deploy apps/web/dist --project-name kreatya-web --branch "$BRANCH"
          npx wrangler pages deploy apps/admin/dist --project-name kreatya-admin --branch "$BRANCH"
